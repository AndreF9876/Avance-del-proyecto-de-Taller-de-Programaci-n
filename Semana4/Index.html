<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana04</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        header, nav, main, section, article, aside {
            padding: 15px;
            margin: 10px;
            border: 1px solid #ccc;
        }
        /* Estilos para cabecera */
        header {
            background-color: #f4a261; 
            text-align: center;
        }
        nav {
            background-color: #2a9d8f; 
            display: flex;
            justify-content: center;
        }
        footer {
            background-color: #264653; 
            color: white;
            text-align: center;
        }
        a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        a:hover {
            text-decoration: underline;
            color:beige;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mi sitio Web</h1>
        <p>Bienvenido a mi primera pagina en HTML5</p>
    </header>
    <nav>
        <a href="">Inicio</a>
        <a href="">Catalogo</a>
        <a href="">Contactos</a>
    </nav>
    <main>
        <section>
            <h2>Sección Principal</h2>
            <article>
                <h3>Articulo 1</h3>
                <p>Este es el contenido del articulo 1.</p>
            </article>
            <article>
                <h3>Articulo 2</h3>
                <p>Este es el contenido del articulo 2.</p>
            </article>
            <aside>
                <h3>Información Adicional</h3>
                <p>Publicidad, enlaces, información relevante.</p>
            </aside>
            <footer>
                <p>Derechos Reservados: &copy;</p>
            </footer>
        </section>
    </main>
</body>
</html>
