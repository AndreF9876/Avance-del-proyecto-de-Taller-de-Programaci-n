<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /*Selectores de etiqueta*/
    p{
        color: royalblue;
        font-weight: bold;  /*Hace que el texto sea negrita*/
    }
    /*Selectores de clase*/
    .importante{
        font-weight: bold;
        color: red;
    }
    /*Selectores de id*/
    #titulo{
        background-color: gray;
        color: white;
    }

</style>
<body>
    <h1 id="titulo">Mi pagina</h1>
    <h2 id="titulo">Descripcion de mi sitio web - Semana 6</h2> 
    <p>Texto normal</p>
    <p class="importante">Texto importante</p>
    <div>
        <p>Parrafo dentro de un div</p>
    </div>
    <a href="">Pasa el mouse aca</a>
</body>
</html>
