<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    /*Selectores de ID*/
    #Encabezado{ /*El simbolo # se utiliza para seleccionar un elemento por su ID*/
        background-color: #333;
        color: white;
        padding: 15px;
        text-align: center;
    }   
    .parrafo{ /*El simbolo . se utiliza para seleccionar un elemento por su clase*/
        font-size: 16px;
        color: blue;
    }
    .especial{ /*Otra clase para el parrafo especial*/
        font-weight: bold;
        color: red;
    }
    </style>
</head>
<body>
    <h1 id="Encabezado">Mi pagina web</h1>
    <p class="parrafo">Este es un párrafo de ejemplo.</p>
    <p class="parrafo">Este es mi segundo párrafo.</p>
    <p class="especial" id="especial">Este es un párrafo especial.</p>
</body>
</html>
