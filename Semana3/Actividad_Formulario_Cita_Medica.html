<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Formulario de Reserva Médica de Cita Medica</h2>
    <form action="">
        <fieldset> 
        <!--Texto-->
        <label>Nombre Completo:</label><br>
        <input type="text" placeholder=" Ingrese su nombre" required><br><br>
        <!--Email-->
        <label>Correo Electrónico:</label> <br>
        <input type="email" placeholder="Ingrese su correo electrónico" required><br><br>
        <!--Teléfono-->
        <label>Teléfono:</label><br>
        <input type="tel" placeholder="Ej: +51 999 999 999" required><br><br>
        <!--Fecha-->
        <label>Fecha de Nacimiento:</label><br>
        <input type="date" required><br><br>
        <!--Radio-->
        <label>Género:</label><br>
        <input type="radio" name="genero" value="masculino" required> Masculino<br>
        <input type="radio" name="genero" value="femenino" required> Femenino<br>
        <input type="radio" name="genero" value="otro" required> Otro<br><br>
        <!--Select-->
        <label>Especialidad requerida:</label><br>
        <select name="especialidad" required>
            <option value="">Seleccione una especialidad</option>
            <option value="medicina-general">Medicina General</option>
            <option value="pediatria">Pediatria</option>
            <option value="ginecologia">Ginecologia</option>
        </select><br><br>
        <!--Fecha de la cita-->
        <label>Fecha de la Cita:</label><br>
        <input type="date" required><br><br>
        <!--Hora de la cita-->
        <label>Hora de la Cita:</label><br>
        <input type="time" required><br><br>
        <!--Textarea-->
        <label>Comentarios:</label><br>
        <textarea rows="4" cols="30"></textarea> <br><br>
        <!--Boton-->
        <button type="submit">Reservar cita</button>
        <button type="reset">Limpiar</button>
        
    </form>
</body>
</html>
